name: Telegram Bot Daily 7-21

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: bot-daily-7-21
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fonts, FFmpeg & Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b fonts-vazirmatn ffmpeg curl
          curl -L -s -o SportFont.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/lalezar/Lalezar-Regular.ttf"
          pip install --upgrade Pillow requests jdatetime pytz yt-dlp curl_cffi

      - name: Run Bot (07:00 - 21:00 Tehran)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python boot.py

      - name: Save state and restart only if before 21:00 Tehran
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Update state" || true
            git pull --rebase --autostash origin main || git rebase --abort || true
            git push || true
          fi
          TEHRAN_HOUR=$((10#$(TZ='Asia/Tehran' date +%H)))
          if [ "$TEHRAN_HOUR" -ge 7 ] && [ "$TEHRAN_HOUR" -lt 21 ]; then
            gh workflow run asli.yml || true
          else
            echo "Outside 07:00-21:00 Tehran time. Sleeping until 07:00 tomorrow."
          fi
